schema_version: 1
tool_version: v1.8.4
tool_checksums_sha256: 32d5e7f8434aca41efde16fe4f8a352074ed74e9b5447b5d39e16009ee3d718e
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2-baseline.txt
operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPropagationExtraction$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzTenantIDRoundTrip$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./http]
        fuzz: '^FuzzHTTPHeaderExtraction$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./jsonrpc]
        fuzz: '^FuzzJSONRPCMetadata$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
