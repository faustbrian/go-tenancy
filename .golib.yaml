schema_version: 1
tool_version: v2.4.0
tool_checksums_sha256: 875e5592e9fbea713c492d9e6979202e1d6bf687f52f55654e3e72c192963273
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2-baseline.txt
operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: [.]
        run: '^TestGroupConcurrentDrainWaitsForAcceptedWorkBeforeCancellingItsContext$'
        count: 1
        race: true
        timeout: 2m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPropagationExtraction$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzTenantIDRoundTrip$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./http]
        fuzz: '^FuzzHTTPHeaderExtraction$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./jsonrpc]
        fuzz: '^FuzzJSONRPCMetadata$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
